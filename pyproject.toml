[project]
name = "mindforge-ai-service"
version = "0.1.0"
description = "MindForge AI 的 Python AI 服务：文档解析、分块、向量化、RAG 检索与对话"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openai>=3.26.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "rapidocr-onnxruntime>=1.4.4",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.workspace]
members = [
    "mindforge-ai-service",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "reportlab>=5.0.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

# 说明
# · 这是「应用」不是「库」，所以刻意不写 [build-system] 和 [project.scripts]：
#   没有 [build-system] 时 uv 会把它当 virtual project，不做 editable install —— 正是我们要的。
# · 依赖用 `uv add xxx` 添加，会自动写进上面的 dependencies。
# · 原来 uv init 生成的 [project.scripts] 指向 `mindforge_ai_service:main`，
#   那个函数不存在，留着会让 uv sync 在生成入口点时出问题，所以删掉了。

[tool.pytest.ini_options]
# 让 `import app.xxx` 能直接用（pytest 7+ 的 pythonpath 选项）
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: 真实链路端到端测试。需要四个服务都在跑，会真调大模型、烧 token、跑十几分钟，默认不跑。",
]
# 默认跳过 e2e：日常改代码只要几秒钟的反馈，不想每次都等十几分钟、还花钱。
# 要跑真实链路时显式指定：pytest -m e2e
addopts = "-m 'not e2e'"

[tool.ruff]
# 中文注释多，行长不是主要矛盾；E501 也不在下面的 select 里。
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# 刻意从保守规则集起步：只开「一定是问题」的规则，避免第一天就产生大片历史告警。
# 后续新增规则时，先跑 `ruff check --statistics` 评估量级，再决定是否纳入阻断。
select = [
    "E4",  # import 相关（E401/E402）
    "E7",  # 语法层面的明显错误
    "E9",  # 运行时错误（如未定义变量）
    "F",   # pyflakes：未使用导入/变量、未定义名称
    "I",   # import 排序
    "UP",  # pyupgrade：过时写法
    "SIM", # 可简化写法
    "B",   # bugbear：常见陷阱
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
# P0 阶段只报告、不阻断：当前有 41 条历史类型问题（主要在 services/interview.py、chat.py），
# 清零后再把 CI 里的 continue-on-error 去掉。

